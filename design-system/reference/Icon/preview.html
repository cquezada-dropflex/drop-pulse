<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Icon</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.DropFlex, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'df-row', style:{gap:18}}, ['sparkle','eye','check','x','loader','check-circle','alert','inbox','box','megaphone','chat','lock','image','tag','text','store','send','arrow-up','power','undo','edit','search','clock','truck','trend','settings','plus','more','chevron-right','chevron-left'].map(function(n){ return h('span',{key:n, title:n, style:{display:'inline-flex'}}, h(D.Icon,{name:n, label:n})); })));
</script>
</body>
</html>

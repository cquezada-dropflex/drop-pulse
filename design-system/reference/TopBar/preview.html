<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>TopBar</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.DropFlex, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'flex', flexDirection:'column', gap:12, padding:16, maxWidth:390}},
  h('div',{style:{border:'1px solid var(--border)', borderRadius:12, overflow:'hidden'}}, h(D.TopBar,{title:'Productos', subtitle:'24 productos', large:true, actions:[h(D.IconButton,{key:1,icon:'search',label:'Buscar'}), h(D.IconButton,{key:2,icon:'plus',label:'Nuevo producto',variant:'primary'})]})),
  h('div',{style:{border:'1px solid var(--border)', borderRadius:12, overflow:'hidden'}}, h(D.TopBar,{back:'Productos', title:'Corrector de postura', subtitle:'2 de 5 etapas · editado hace 2 h', actions:h(D.IconButton,{icon:'sparkle',label:'Abrir asistente'})}))));
</script>
</body>
</html>

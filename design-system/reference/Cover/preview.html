<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DropFlex</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--background); color:var(--foreground); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--primary); }
  .tint { fill:var(--primary-soft); }
  .ink { fill:var(--foreground); }
  .ok { fill:var(--success); }
  .warn { fill:var(--warning); }
  .ground { fill:var(--background); }
  .blk { rx:var(--radius-lg); }
  .pill { rx:3px; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:80px; line-height:.92; font-weight:600; letter-spacing:-.035em; color:var(--foreground); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--muted-foreground); }
</style>
</head>

<div class="cover">

<svg viewBox="0 0 480 288" width="480" height="288">
<!--

  arrangement one tall accent slab, a tint field and an ink slab, bottoms on one line at space-6 from the edge, space-4 gutters
  pattern     the StageMeter itself, from "Retomar donde quedaste": 8 rows of six 6px pills at a space-5 pitch over the tint, done in foreground, current in primary, one stuck in warning, pending cut in background — a staircase of products advancing
  scales      gutters space-4; pitch space-5 (20px); pill gap 4px (space-1); corners radius-lg, pills radius-full (half of 6px)
-->
